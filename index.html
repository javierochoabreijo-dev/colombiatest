<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColombiaTest · Prepárate para el examen de nacionalidad</title>

    <!-- Se aplica el tema ANTES del primer pintado: si esto viviera en React,
         la primera pintura saldría con el tema del sistema y daría un
         parpadeo al montar. Lo único que la app guarda en el navegador. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vueltiao-tema");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
