<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Barra de estado = color del fondo (--ground) de cada tema. Si el
         usuario fuerza un tema con el botón, tema.js reescribe estas dos. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2EADB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17120E" />
    <title>ColombiaTest · Prepárate para el examen de nacionalidad</title>
    <meta name="description" content="Prepárate para el examen de conocimientos de la nacionalidad colombiana." />
    <link rel="canonical" href="https://colombiatest.vercel.app/" />

    <!-- Marca: los ficheros viven en public/brand/. /favicon.ico también va en
         la raíz porque algunos navegadores lo piden ahí sin mirar el <head>. -->
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />

    <!-- Vista previa al compartir el enlace (Open Graph y X/Twitter). Las URLs
         de imagen son absolutas: los rastreadores no resuelven rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ColombiaTest" />
    <meta property="og:title" content="ColombiaTest · Prepárate para el examen de nacionalidad" />
    <meta property="og:description" content="Prepárate para el examen de conocimientos de la nacionalidad colombiana." />
    <meta property="og:url" content="https://colombiatest.vercel.app/" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:image" content="https://colombiatest.vercel.app/brand/opengraph-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ColombiaTest" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ColombiaTest · Prepárate para el examen de nacionalidad" />
    <meta name="twitter:description" content="Prepárate para el examen de conocimientos de la nacionalidad colombiana." />
    <meta name="twitter:image" content="https://colombiatest.vercel.app/brand/opengraph-image.png" />
    <meta name="twitter:image:alt" content="ColombiaTest" />

    <!-- Se aplica el tema ANTES del primer pintado: si esto viviera en React,
         la primera pintura saldría con el tema del sistema y daría un
         parpadeo al montar. La app guarda dos cosas en el navegador, esta y
         el progreso por área; ninguna sale del dispositivo. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vueltiao-tema");
          if (t === "dark" || t === "light") {
            document.documentElement.dataset.theme = t;
            var c = t === "light" ? "#F2EADB" : "#17120E";
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute("content", c);
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
